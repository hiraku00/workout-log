name: WorkoutLog
options:
  bundleIdPrefix: com.workoutlog
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  WorkoutLog:
    type: application
    platform: iOS
    sources:
      - path: WorkoutLog
        excludes:
          - Resources/Fonts
    settings:
      base:
        INFOPLIST_FILE: WorkoutLog/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hiraku.WorkoutLog

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: 3HQ4T349Y9
        CODE_SIGN_STYLE: Automatic


    info:
      path: WorkoutLog/Info.plist
      properties:
        CFBundleDisplayName: Workout Log
        CFBundleName: Workout Log
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        NSFaceIDUsageDescription: Face IDを使用してアプリへのアクセスを保護します
  WorkoutLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WorkoutLogTests
    dependencies:
      - target: WorkoutLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hiraku.WorkoutLogTests
